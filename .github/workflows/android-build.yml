
name: Build PasokhYar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PasokhYar_Android_Project.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project
        run: |
          unzip -q PasokhYar_Android_Project.zip
          ls PasokhYar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p PasokhYar assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: PasokhYar-APK
          path: PasokhYar/app/build/outputs/apk/debug/app-debug.apk
